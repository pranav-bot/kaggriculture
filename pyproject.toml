[project]
name = "kaggriculture"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "pranav23advani@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipynb>=0.5.1",
    "kaggle>=2.2.4",
    "kaggle-environments>=1.32.7",
]

[project.scripts]
kaggriculture = "kaggriculture:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
